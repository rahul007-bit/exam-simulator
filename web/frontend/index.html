<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Kubernetes Exam Simulator</title>
    <script>
      // Apply the persisted (or OS-preferred) theme before first paint to avoid
      // a flash of the wrong colours. Keep the key + values in sync with
      // src/composables/useTheme.ts.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('cka:theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* no-op: base styles still provide a dark default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
