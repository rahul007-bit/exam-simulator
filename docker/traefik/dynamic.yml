# Traefik v3 dynamic configuration for the CKA lab platform.
#
# Routers run on the `websecure` entrypoint; HTTP is redirected to HTTPS by the
# static config. All public traffic is served by the FastAPI app, except:
#   - /dashboard      -> Traefik's own dashboard UI   (basic auth)
#   - /api/<traefik>  -> Traefik's internal data API  (basic auth)
#   - /metrics        -> Prometheus metrics           (basic auth)
#
# NOTE on `/api`: the FastAPI app serves its whole backend under `/api/...`
# (see web/server.py), while the Traefik dashboard also fetches its data from
# `/api/...`. A blanket `/api` -> api@internal router would shadow the app and
# break the SPA, so only Traefik's own internal API prefixes (overview, version,
# entrypoints, http, tcp, udp, rawdata, health - none of which collide with the
# app) are sent to api@internal. Every other `/api/*` path keeps proxying to the
# app, so `/api/does-not-exist` correctly returns the app's 404.

http:
  routers:
    # FastAPI application: SPA, /admin, /api/*, /ws/* (websockets), /novnc/*.
    app:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      service: app
      priority: 10
      tls: {}

    # Traefik dashboard UI, behind basic auth.
    dashboard:
      rule: "PathPrefix(`/dashboard`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - dashboard-auth
      priority: 100
      tls: {}

    # Traefik dashboard's own data API, behind basic auth. Kept separate from
    # the app's /api surface (see note above).
    dashboard-api:
      rule: >-
        PathPrefix(`/api/overview`) || PathPrefix(`/api/version`) ||
        PathPrefix(`/api/entrypoints`) || PathPrefix(`/api/http`) ||
        PathPrefix(`/api/tcp`) || PathPrefix(`/api/udp`) ||
        PathPrefix(`/api/rawdata`) || PathPrefix(`/api/health`)
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - dashboard-auth
      priority: 200
      tls: {}

    # Prometheus metrics, behind basic auth.
    metrics:
      rule: "PathPrefix(`/metrics`)"
      entryPoints:
        - websecure
      service: prometheus@internal
      middlewares:
        - dashboard-auth
      priority: 100
      tls: {}

  services:
    app:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"

  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/users.txt

tls:
  # Self-signed certificate generated by setup.sh (SAN IP:10.8.0.15).
  certificates:
    - certFile: /etc/traefik/certs/server.crt
      keyFile: /etc/traefik/certs/server.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/server.crt
        keyFile: /etc/traefik/certs/server.key
