id: TR-C01
title: 'Chaos: Resolve Pod Resource Starvation and Parent Cgroup Pressure'
domain: troubleshooting
difficulty: crazy
points: 6
target_context: k3d-cka
namespace: cgroup-limits
cluster_scoped: false
tags:
- crazy
- cgroups
- resources
- eviction
description: 'Workloads in namespace `cgroup-limits` are being evicted / killed without
  clear pod-level OOM events due to severe CPU/Memory request over-subscription.

  Analyze the namespace ResourceQuota and LimitRange, adjust container requests and
  limits on deployment `critical-api` to fit within quota (`requests.cpu: 100m, requests.memory:
  128Mi`), and ensure all 3 replicas reach Ready.'
grader_hint: Deployment critical-api has 3/3 ready pods within namespace resource
  quota limits.
