id: TR-007
title: Fix PVC Stuck in Pending due to Invalid StorageClass
domain: troubleshooting
difficulty: medium
points: 3
target_context: k3d-cka
namespace: data-ops
cluster_scoped: false
tags:
- storage
- pvc
- storageclass
description: 'PVC data-claim in namespace data-ops is stuck in Pending because it
  specifies a non-existent StorageClass fast-nvme-ssd, preventing pod data-consumer from starting.

  Update the PVC configuration to use the default StorageClass local-path
  so data-claim becomes Bound and the pod can start.'
grader_hint: PVC data-claim in data-ops is Bound using local-path.
