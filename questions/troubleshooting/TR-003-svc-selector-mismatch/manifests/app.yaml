apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-backend
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-app
      tier: backend
  template:
    metadata:
      labels:
        app: cart-app
        tier: backend
    spec:
      containers:
      - name: web
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cart-svc
  namespace: ecommerce
spec:
  selector:
    app: shopping-cart # Misconfigured selector
  ports:
  - port: 80
    targetPort: 80
