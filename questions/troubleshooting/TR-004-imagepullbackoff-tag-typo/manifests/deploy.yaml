apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-svc
  namespace: warehouse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: web
        image: nginx:non-existent-tag-999
        ports:
        - containerPort: 80
