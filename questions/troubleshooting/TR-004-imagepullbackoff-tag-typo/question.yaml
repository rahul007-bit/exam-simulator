description: 'Deployment `inventory-svc` in namespace `warehouse` is failing with
  `ImagePullBackOff` due to a mistyped image tag.

  Fix the deployment image to use `nginx:1.25.4-alpine` so all replicas start successfully.'
grader_hint: Deployment inventory-svc in warehouse has 2/2 ready pods.
