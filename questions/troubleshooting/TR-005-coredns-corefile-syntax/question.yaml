description: 'CoreDNS pods in `kube-system` are crashlooping due to an invalid configuration
  directive in the `coredns` ConfigMap.

  Inspect CoreDNS logs, fix the invalid block in the `coredns` ConfigMap in namespace
  `kube-system`, and restart the CoreDNS deployment to restore cluster DNS.'
grader_hint: CoreDNS pods in kube-system are running and passing readiness probes.
